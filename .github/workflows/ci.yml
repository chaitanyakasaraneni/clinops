name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.1,<3", "pandas>=3,<4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.pandas }}"

      - name: Lint and format check
        if: matrix.pandas == 'pandas>=3,<4'
        run: |
          ruff check clinops/
          ruff format --check clinops/ tests/

      - name: Type check
        if: matrix.pandas == 'pandas>=3,<4'
        run: mypy clinops/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --cov=clinops --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.pandas == 'pandas>=3,<4'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --strict fails on broken links, docstring errors, and (via mkdocs-jupyter)
      # any tutorial notebook cell that raises.
      - name: Build docs
        run: mkdocs build --strict

  publish:
    needs: [test, docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch
      - run: hatch build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
