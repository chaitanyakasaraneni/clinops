name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  # Newer supported Python versions, on the latest pandas. The main "test" job
  # below covers Python 3.12 with pandas 2 and 3, plus lint and type checks.
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --no-cov

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.1,<3", "pandas>=3,<4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.pandas }}"

      - name: Lint and format check
        if: matrix.pandas == 'pandas>=3,<4'
        run: |
          ruff check clinops/
          ruff format --check clinops/ tests/

      - name: Type check
        if: matrix.pandas == 'pandas>=3,<4'
        run: mypy clinops/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --cov=clinops --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.pandas == 'pandas>=3,<4'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatch
      - run: hatch build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
